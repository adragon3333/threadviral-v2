    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const norm=s=>s.toLocaleLowerCase('vi').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d');function render(){document.querySelectorAll('audio').forEach(a=>a.pause());const q=norm(document.getElementById('search').value),p=document.getElementById('provider').value,g=document.getElementById('gender').value;const rows=voices.filter(v=>(!p||v.provider===p)&&(!g||v.gender===g)&&norm(v.name+' '+v.description).includes(q));document.getElementById('count').textContent=rows.length+' / '+voices.length+' giọng';document.getElementById('voices').innerHTML=rows.map(v=>`<article><h2>${esc(v.name)}</h2><small>${v.gender==='female'?'Nữ':'Nam'} · ${v.provider==='capcut'?'CapCut · Cơ bản':'VieNeu · Pro'} · ${v.duration.toFixed(1)} giây</small><p class="meta">${esc(v.description)}</p><audio aria-label="Mẫu giọng ${esc(v.name)}" controls preload="none" src="${v.id}.mp3"></audio><a href="${v.id}.mp3" download="${esc(v.name)}.mp3">Tải MP3</a></article>`).join('');}for(const id of ['search','provider','gender'])document.getElementById(id).addEventListener(id==='search'?'input':'change',render);document.addEventListener('play',e=>{if(e.target.tagName==='AUDIO')document.querySelectorAll('audio').forEach(a=>{if(a!==e.target)a.pause();});},true);render();</script></body></html>
